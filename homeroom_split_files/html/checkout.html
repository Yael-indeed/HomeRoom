<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-out - Homeroom</title>
  <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>
  
  <div class="topbar">
    <div class="topbar-title">Check-out</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
      <a href="booking.html" class="btn btn-ghost btn-sm">Bookings</a>
      <a href="newbooking.html" class="btn btn-ghost btn-sm">+ New Booking</a>
      <a href="checkout.html" class="btn btn-ghost btn-sm" style="color:var(--gold-400);">Check-out</a>
    </div>
  </div>
  <div class="page-body">
    <div style="max-width:540px;margin:40px auto;">
      <div class="card" style="text-align:center;padding:40px 32px;">
        <div style="font-size:48px;margin-bottom:16px;">🔍</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px;">Scan Barcode to Check Out</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:28px;">Point the barcode scanner at the guest stub, or type the booking number below.</div>
        <div class="input-wrap" style="margin-bottom:16px;">
          <label class="input-label">Booking Number / Barcode</label>
          <input type="text" class="input-field" id="checkout-input" placeholder="BN-XXXXXXXXX or scan barcode…" autofocus oninput="onScanInput(this.value)" style="font-size:16px;text-align:center;letter-spacing:.08em;font-family:var(--mono);">
        </div>
        <button class="btn btn-gold btn-lg w-full" onclick="processCheckout()">Check Out Guest</button>
      </div>
      <div id="checkout-result" class="hidden" style="margin-top:16px;"></div>
    </div>
  </div>

  <script src="../js/checkout.js"></script>
</body>
</html>
